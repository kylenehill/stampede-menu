<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stampede Slideshow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Two stacked slides; the active one fades in over the other */
    .slide {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      transition: opacity 0.8s;
      overflow: hidden;
    }

    .slide.show { opacity: 1; z-index: 1; }

    /* Blurred copy of the image fills the screen behind it */
    .slide .bg {
      position: absolute;
      inset: -40px;
      width: calc(100% + 80px);
      height: calc(100% + 80px);
      object-fit: cover;
      filter: blur(30px) brightness(0.4);
    }

    .slide .img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #status {
      position: fixed;
      bottom: 10px;
      right: 20px;
      font: 12px sans-serif;
      color: #333;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="slide"><img class="bg" alt="" /><img class="img" alt="" /></div>
  <div class="slide"><img class="bg" alt="" /><img class="img" alt="" /></div>
  <div id="status"></div>

  <script>
    // Shows every image listed in stampede-site's images/slider/manifest.json
    // (the same list the website's slider uses). Add an image to that folder and
    // list it in manifest.json, and the screen picks it up on its next refresh.
    const DISPLAY_SEC = 20;   // seconds each image stays up
    const REFRESH_MIN = 10;   // how often to re-check the image list
    const SOURCES = [
      'https://stampedelivermore.com/images/slider/',
      'https://raw.githubusercontent.com/kylenehill/stampede-site/main/images/slider/',
    ];

    let images  = [];
    let index   = -1;
    let active  = 0;
    let version = Date.now();
    const slideEls = document.querySelectorAll('.slide');

    async function fetchImages() {
      for (const base of SOURCES) {
        try {
          const res = await fetch(base + 'manifest.json?v=' + Date.now());
          if (!res.ok) continue;
          const files = await res.json();
          if (!Array.isArray(files) || !files.length) continue;
          images = files.map(f => base + encodeURIComponent(f));
          version = Date.now();
          document.getElementById('status').textContent = '';
          return;
        } catch (e) { /* try the next source */ }
      }
      document.getElementById('status').textContent = 'Could not load slider images';
    }

    function nextSlide(failures = 0) {
      if (!images.length || failures >= images.length) return;
      index = (index + 1) % images.length;
      const src  = images[index] + '?v=' + version;
      const next = slideEls[1 - active];
      const img  = next.querySelector('.img');

      // Swap only once the new image has loaded, so the screen never flashes black
      img.onload = () => {
        img.onload = img.onerror = null;
        next.classList.add('show');
        slideEls[active].classList.remove('show');
        active = 1 - active;
      };
      img.onerror = () => nextSlide(failures + 1);  // skip a broken image
      next.querySelector('.bg').src = src;
      img.src = src;
    }

    (async () => {
      await fetchImages();
      active = 1;  // so the first slide lands on slideEls[0]
      nextSlide();
      setInterval(nextSlide, DISPLAY_SEC * 1000);
      setInterval(fetchImages, REFRESH_MIN * 60 * 1000);
    })();
  </script>
</body>
</html>
